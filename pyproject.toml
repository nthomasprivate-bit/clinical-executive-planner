[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-executive-planner"
version = "2.0.0"
description = "Local, synthetic-data clinical and professional executive planner"
requires-python = ">=3.12"
dependencies = ["streamlit>=1.41,<2", "SQLAlchemy>=2.0.36,<3", "pandas>=2.2,<3", "tzdata>=2024.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["clinical_planner*"]

[tool.setuptools.package-data]
clinical_planner = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
